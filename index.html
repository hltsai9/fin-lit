<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Literacy Lab</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">$</span>
      <div>
        <h1>Financial Literacy Lab</h1>
        <p class="tagline">Interactive dashboards &amp; games for real-world money skills</p>
      </div>
    </div>
    <div class="progress-wrap" title="Modules visited in this topic">
      <div class="progress-label"><span id="progressTopicName">Topic</span> progress</div>
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">0 / 0</div>
    </div>
  </header>

  <nav class="topics-nav" id="topicNav" aria-label="Topics"></nav>
  <nav class="tabs" id="moduleTabs" role="tablist" aria-label="Modules"></nav>

  <main id="moduleContent"></main>

  <footer>
    <p>Educational tool — not financial advice. Numbers are estimates; consult a fiduciary advisor for personal decisions.</p>
  </footer>

  <!-- Engine -->
  <script src="app.js"></script>

  <!-- Topics: add a new <script> tag for each topic you want to load -->
  <script src="topics/retirement-401k.js"></script>
  <script src="topics/emergency-fund.js"></script>
</body>
</html>
